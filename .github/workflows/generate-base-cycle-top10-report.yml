name: Update all Dashboards (legacy V4-D entry)
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional completed date; updates all three Dashboards"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  all-dashboards:
    uses: ./.github/workflows/publish-all-stock-dashboards.yml
    with:
      report_date: ${{ inputs.report_date }}
    secrets: inherit
